// players send bugs, ideas and balance notes; they land in feedback/<push id> where only admins can read them
const FB_CATS = [["bug", "🐞 Bug"], ["idea", "💡 Idea"], ["balance", "⚖ Balance"], ["other", "💬 Other"]];
var FBS = { last: 0, cat: "idea", draft: "" };
var FBB = { list: null, at: 0, sort: "top", cat: "all", open: {}, tab: "write" };
function fbMe() { return pKey(APR_USER); }
function fbScore(x) { const v = x.v && typeof x.v === "object" ? Object.values(x.v) : []; return { up: v.filter(n => n === 1).length, dn: v.filter(n => n === -1).length }; }
async function fbLoad(force) {
  if (!force && FBB.list && Date.now() - FBB.at < 20000) return FBB.list;
  try {
    const r = await fetch(`${cloudUrl()}/feedback.json?orderBy=%22%24key%22&limitToLast=200${cloudKey() ? "&auth=" + encodeURIComponent(cloudKey()) : ""}`);
    const j = r.ok ? await r.json() : null;
    FBB.list = Object.entries(j || {}).filter(([, x]) => x && typeof x.m === "string" && typeof x.k === "string").map(([id, x]) => Object.assign({ id }, x)); FBB.at = Date.now();
  } catch (e) { FBB.list = FBB.list || []; }
  return FBB.list;
}
// everyone can read everyone's feedback, vote on it and reply
function openFeedback(tab) {
  if (tab) FBB.tab = tab;
  const m = modal35("💡 Feedback", "m35-fb");
  const draw = async () => {
    const tabs = `<div class="fbtabs"><button data-ft="write" class="${FBB.tab === "write" ? "on" : ""}">📝 Write</button><button data-ft="board" class="${FBB.tab === "board" ? "on" : ""}">📣 Community feedback${FBB.list ? ` (${FBB.list.length})` : ""}</button></div>`;
    if (FBB.tab === "write") {
      m.body.innerHTML = tabs + `<p class="mut">Found a bug, have an idea, think something is too strong or too weak? Everyone can read, vote on and reply to feedback, and the developer reads all of it.</p>
      <div class="fbcats">${FB_CATS.map(([k, n]) => `<button data-fc="${k}" class="${FBS.cat === k ? "on" : ""}">${n}</button>`).join("")}</div>
      <textarea id="fbT" rows="7" maxlength="1500" placeholder="${FBS.cat === "bug" ? "What happened, and what did you expect? Which screen were you on?" : "Tell us what you think…"}">${esc(FBS.draft)}</textarea>
      <div class="fbfoot"><span class="mut" id="fbN">${FBS.draft.length}/1500</span><button class="cta" id="fbGo">Post</button></div><div class="mut" id="fbMsg"></div>`;
      const t = m.body.querySelector("#fbT");
      t.oninput = () => { FBS.draft = t.value; m.body.querySelector("#fbN").textContent = `${t.value.length}/1500`; };
      t.onkeydown = e => e.stopPropagation(); setTimeout(() => t.focus(), 30);
      m.body.querySelectorAll("[data-fc]").forEach(b => b.onclick = () => { FBS.cat = b.dataset.fc; draw(); });
      m.body.querySelector("#fbGo").onclick = () => fbSend(m, () => { FBB.tab = "board"; FBB.sort = "new"; draw(); });
    } else {
      m.body.innerHTML = tabs + `<div class="mut">Loading…</div>`;
      await fbLoad(); if (!m.body.isConnected) return;
      m.body.innerHTML = tabs + `<div id="fbBoard"></div>`; fbBoard(m.body.querySelector("#fbBoard"), false, draw);
    }
    m.body.querySelectorAll("[data-ft]").forEach(b => b.onclick = () => { FBB.tab = b.dataset.ft; draw(); });
  };
  draw();
}
function fbBoard(B, admin, redraw) {

   <div class="fbsort"><button data-bs="top" class="${FBB.sort === "top" ? "on" : ""}">▲ Top</button><button data-bs="new" class="${FBB.sort === "new" ? "on" : ""}">🕑 New</button><button id="fbRe" title="Refresh">⟳</button></div></div>
   ${L.length ? L.map(x => { const S = fbScore(x), my = x.v && x.v[me], R = reps(x), op = FBB.open[x.id];
     return `<div class="fbrow" data-id="${esc(x.id)}"><div class="fbvote"><button data-vt="1" class="${my === 1 ? "on" : ""}" title="Agree">▲</button><b>${S.up - S.dn}</b><button data-vt="-1" class="${my === -1 ? "on dn" : ""}" title="Disagree">▼</button></div>
      <div class="fbbody"><div class="fbh"><b>${esc(cat(x.c))}</b> · <span class="fbu">${esc(String(x.u || "?"))}</span> · <span class="mut">${ago(x.t)}${admin ? ` · Lv ${+x.lv || 0} · ${esc(String(x.w || ""))} · build ${esc(String(x.b || "?"))}` : ""}</span>${admin || x.k === me ? `<button data-fdel title="Delete">🗑</button>` : ""}</div>
      <div class="fbm">${esc(x.m)}</div><div class="fbmeta mut">👍 ${S.up} · 👎 ${S.dn} · <a href="#" data-op>${R.length ? `💬 ${R.length} repl${R.length === 1 ? "y" : "ies"}` : "💬 Reply"}</a></div>
      ${op ? `<div class="fbreps">${R.map(r => `<div class="fbrep"><b>${esc(String(r.u || "?"))}</b> <span class="mut">${ago(r.t)}</span><div>${esc(r.m)}</div></div>`).join("")}<div class="fbrin"><input maxlength="300" placeholder="Reply…" data-ri><button data-rs>Reply</button></div></div>` : ""}</div></div>`; }).join("") : `<p class="mut">No feedback here yet. Be the first!</p>`}`;
  const again = () => fbBoard(B, admin, redraw);

  B.querySelectorAll("[data-bs]").forEach(b => b.onclick = () => { FBB.sort = b.dataset.bs; again(); });

async function fbSend(m, redraw) {
  const say = s => { const e = m.body.querySelector("#fbMsg"); if (e) e.textContent = s; }, txt = FBS.draft.trim();
  if (txt.length < 3) return say("Write a little more first.");
  if (Date.now() - FBS.last < 60000) return say("Thanks! Please wait a minute before sending more.");
  if (!cloudOn()) return say("Feedback needs the online connection. Try again when you're online.");
  const tok = await ltdToken();
  if (!tok) return ltdAskPw("Sign in once on this device to send feedback.", () => fbSend(m, redraw), "💡 Send feedback");
  const b = m.body.querySelector("#fbGo"); if (b) b.disabled = true; say("Sending…");
  const body = { k: pKey(APR_USER), u: String((typeof dispName === "function" ? dispName() : APR_USER) || APR_USER).slice(0, 24), t: Date.now(), c: FBS.cat, m: txt.slice(0, 1500), b: String(typeof BUILD_ID === "string" ? BUILD_ID : "").slice(0, 24), sv: SAVE_VER, lv: playerLevel(), w: String(curHub || "").slice(0, 24) };
  const r = await ltdDb("feedback", "POST", body, tok);
  if (r.ok) { FBS.last = Date.now(); FBS.draft = ""; FBB.at = 0; notify("✅ Feedback posted. Thank you!"); gameEvent("feedback", {}); await fbLoad(true); redraw(); }
  else { if (b) b.disabled = false; say(r.status === 401 || r.status === 403 ? "The server refused it (banned accounts can't send feedback, or your sign-in expired: reload and try again)." : "Couldn't reach the server. Your text is kept; try again in a moment."); }
}

var LORE_TAB = "world";
function loreOwned(id) { return (sv.cards || []).some(x => x.i === id); }
// lore unseals as you play: Mythic stories when you pull the card, Spire flights when you reach them
function loreSpirePeak() { try { return spireState().peak || 0; } catch (e) { return 0; } }
function loreMythVOwned(k) { const j = VE_CARDS.findIndex(x => x[5] === "myth:" + k); return j >= 0 && loreOwned(1000 + j); }
function loreProgress() {
  const a = Object.keys(LORE.mythA).filter(id => loreOwned(+id)).length, f = FLIGHTS.filter((_, i) => loreSpirePeak() >= i * 10 + 1).length, v = veLive() ? LORE.mythV.filter(x => loreMythVOwned(x[0])).length : 0;
  return { have: 3 + a + f + v + (veLive() ? 1 : 0), need: 3 + Object.keys(LORE.mythA).length + FLIGHTS.length + (veLive() ? LORE.mythV.length + 1 : 0) };
}
